plugins:
  - args:
      - light
    url: trapd00r/LS_COLORS
    ice:
      - atclone"dircolors -b LS_COLORS > clrs.zsh"
      - atpull"%atclone"
      - atload'zstyle ":completion:*" list-colors "${(s.:.)LS_COLORS}"'
    comment: |
      From https://zdharma-continuum.github.io/zinit/wiki/LS_COLORS-explanation/
  - args: ["wait", "lucid", "light-mode"]
    for:
      - url: marlonrichert/zcolors.git
        ice:
          - autoload'color; lscolor; zcolors;'
          # less's prompt: zcolors' white on blue (-DPWb) is 2.55:1 under amontillado's light-soft
          # tone (colour 15 is dark there); colour 0 on blue reads on both variants (chz-lfs).
          - atload'less=( ${less:#-DSkY*} -DSkY\$DPkb )'

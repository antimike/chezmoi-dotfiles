plugins:
  # Exported whether or not direnv is built below. BOCO exports it on its (unconditional) build entry.
  - export:
      name: DIRENV_WARN_TIMEOUT
      value: 60s
{{- if not (lookPath "direnv") }}
  - args:
      - as"program"
      - make'!'
      - atclone'./direnv hook zsh > zhook.zsh'
      - atpull'%atclone'
      - pick"direnv"
      - src"zhook.zsh"
    for:
      - url: direnv/direnv
{{- end }}

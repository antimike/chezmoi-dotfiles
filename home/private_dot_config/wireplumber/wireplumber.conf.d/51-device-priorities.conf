# Device priorities for the default sink, source and camera (MH, 2026-10-21).
# WirePlumber picks the highest priority.session among available nodes, unless a
# default was set by hand (`wpctl set-default <id>`, or a desktop volume applet),
# which wins while that device is present. Clear a hand-set default with
# `wpctl clear-default` to go back to these priorities.
#
# Outputs: Bluetooth headphones > the headphone jack (external speakers) > the
# built-in speakers. The last two need no rule: the jack and the speakers are
# separate sinks on this laptop's sound card, and the jack replaces the speakers
# by itself when something is plugged in.
# Inputs: the Logitech C270 webcam mic, ahead of the laptop's mics.
# Camera: the C270, for apps that use PipeWire cameras. Chromium reads the camera
# directly; pick its default in chrome://settings/content/camera.
# Generic matches: they apply on any host with these devices.

monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { priority.session = 3000, priority.driver = 3000 } }
  }
]

monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.usb-046d_C270_HD_WEBCAM.*" } ]
    actions = { update-props = { priority.session = 2500, priority.driver = 2500 } }
  }
]

monitor.v4l2.rules = [
  {
    matches = [ { node.description = "~C270 HD WEBCAM.*" } ]
    actions = { update-props = { priority.session = 1500 } }
  }
]

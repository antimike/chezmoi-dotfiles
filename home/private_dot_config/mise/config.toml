# Global mise toolset. Every pin is exact; bump deliberately with
# `mise use -g <tool>@<version>`, then `chezmoi re-add ~/.config/mise/config.toml`.
# ~/.tool-versions (dot_tool-versions) takes precedence inside $HOME.
[tools]
bun = "1.4.3"
uv = "0.13.0"
just = "1.58.0"
mani = "0.32.1"
ghq = "1.11.2"
go = "1.21.7"
"go:github.com/doronbehar/pistol/cmd/pistol" = "0.5.3"
# Markdown renderer (pistol previews, glow.nvim). 1.5.1's install had no executable (chz-3qa).
glow = "3.0.0"
# Lua formatter for the shell (just lint-lua) and nvim alike; mason no longer installs it (chz-7ze).
stylua = "2.6.0"
# GitHub Actions workflow linter (bd-track's actionlint-system pre-commit hook; nvim-lint
# runs it on .github/workflows/*.y(a)ml). Not in Fedora; aqua backend (chz-7g5).
actionlint = "1.7.12"
# JSON/YAML diff and RFC 6902 patches, for manual diffs (chz-7g5).
jd = "2.5.0"
groovy = "4.0.19"
java = "23-loom+2-48.0.0"
purescript = "0.15.14"
spago = "0.21.0"
terraform = "1.8.2"

[settings]
experimental = true

# xdg-desktop-portal-hyprland (screen sharing).
# Chromium opens two or three portal sessions per share (picker, then capture) and
# passes the first one's restore token to the next; without a token every session
# prompts, so the picker came back 2-3 times per share (Meet, 2026-10-24). This ticks
# the picker's "allow a restore token" box by default.
screencopy {
    allow_token_by_default = true
}

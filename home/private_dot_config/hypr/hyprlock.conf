# hyprlock: the Hyprland lock screen (D63), run by ~/.local/bin/lock-screen.
# Lock through `loginctl lock-session` ($mod+Escape) so every lock takes one path.
# Colours are the theme's (chz-8bg.4): amontillado's hyprlock.conf defines $base00-$base17
# and the roles ($accent, $error, $warning...) as rrggbb, read at each lock. chezmoi's
# run_onchange_after_theme-render script renders it on a fresh machine (the Blazer preset).
# Reference: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

source = ~/.cache/theme/current/hyprlock.conf

$font = Source Code Pro

general {
    # No grace period (the --grace flag; lock-screen passes none): a lock is a lock.
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

# Every monitor: its own contents, blurred and darkened.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.5
    color = rgb($base00)
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 3
    rounding = 12
    inner_color = rgba($base00cc)
    outer_color = rgb($accent)
    check_color = rgb($warning)
    fail_color = rgb($error)
    capslock_color = rgb($warning)
    font_color = rgb($base05)
    font_family = $font
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    fail_text = $PAMFAIL ($ATTEMPTS)
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb($base05)
    font_size = 96
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgb($base05)
    font_size = 22
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

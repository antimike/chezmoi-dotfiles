# hyprlock: the Hyprland lock screen (D63), run by ~/.local/bin/lock-screen.
# Lock through `loginctl lock-session` ($mod+Escape) so every lock takes one path.
# Colours are kitty's Blazer palette (kitty/current-theme.conf); theming
# (docs/plans/theming.md) may generate them later. Reference:
# https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

$font = Source Code Pro
$fg = rgb(d9e5f1)
$bg = rgba(0d1925cc)
$blue = rgb(7979b8)
$red = rgb(b87979)
$yellow = rgb(b8b879)

general {
    # No grace period (the --grace flag; lock-screen passes none): a lock is a lock.
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

# Every monitor: its own contents, blurred and darkened.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.5
    color = rgb(0d1925)
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 3
    rounding = 12
    inner_color = $bg
    outer_color = $blue
    check_color = $yellow
    fail_color = $red
    capslock_color = $yellow
    font_color = $fg
    font_family = $font
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    fail_text = $PAMFAIL ($ATTEMPTS)
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $fg
    font_size = 22
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

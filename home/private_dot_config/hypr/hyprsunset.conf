# hyprsunset (D63): colour temperature by time of day, as redshift did under i3.
# Fixed times (no geolocation). Run by hyprsunset.service under wm-helpers-wayland.target,
# Hyprland only. Live: scroll the bar's sunset module, or `sunset up|down|schedule` (held until
# `sunset schedule`). Never `hyprctl hyprsunset identity` without an argument: it turns identity on.
profile {
    time = 7:00
    identity = true
}

profile {
    time = 20:00
    temperature = 4500
}

profile {
    time = 22:30
    temperature = 3700
}

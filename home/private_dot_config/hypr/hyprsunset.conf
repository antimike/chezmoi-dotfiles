# hyprsunset (D63): colour temperature by time of day, as redshift did under i3.
# Fixed times (no geolocation). Run by hyprsunset.service under wm-helpers-wayland.target,
# Hyprland only. Try a value live: hyprctl hyprsunset temperature 4000 (identity: back to normal).
profile {
    time = 7:00
    identity = true
}

profile {
    time = 20:00
    temperature = 4500
}

profile {
    time = 22:30
    temperature = 3700
}

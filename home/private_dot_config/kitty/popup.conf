# Floating popup windows (Hyprland classes bar-popup, ticket-editor, floater,
# dropdown): the normal config, minus the close confirmation. Launch with
# `kitty -c "$HOME/.config/kitty/popup.conf" --class <class> ...`. The path
# must be absolute: kitty 0.47 resolves neither `~` nor a relative -c path
# and silently falls back to its built-in defaults.
include kitty.conf

# Close without asking, even with a program running (normal windows keep
# kitty's default: ask when a program is running or more than one window).
confirm_os_window_close 0

# Pinned desktop applications and engines (chz-i42), consumed by run_onchange_install-applications.sh.tmpl.
# Package-map entries: `release: applications` (packages.yaml).
#
# Each entry is one release asset with GitHub's asset digest:
#   gh api repos/<owner>/<repo>/releases/tags/<tag> --jq '.assets[]|.name+" "+.digest'
# `url` (optional) replaces the release-asset URL built from repo/tag/asset (a file in a repo at a tag).
# `mode` (optional, default 0755): the installed file's mode; data files (models) use 0644.
# `member` (optional): the asset is a zip and this file inside it is installed. The checksum is the asset's
# (the zip's), checked before extracting.
# `dest`: relative to $HOME. AppImages go to ~/Applications, where appimagelauncherd (AppImageLauncher, pinned
# in appimagelauncher.yaml) integrates them: desktop entry and icon, no rename for installer-placed files.
# `extract` (optional, relative to $HOME): for an AppImage CLI. The installer extracts the AppImage there and
# `dest` becomes a symlink to its `entrypoint` (default AppRun). KataGo's release binary is a type-2 AppImage,
# and AppImageLauncher's binfmt handler opens its integration dialog on every run of one outside ~/Applications
# (it hung headless engine runs; baduk's ticket, 2026-11-20). KataGo is a CLI engine (Sabaki, KaTrain), so it
# goes on PATH, extracted, with no app-menu entry. A bump extracts to a new versioned directory; the old one
# stays until deleted by hand.
#
# Pin rule: exact tag, at least 14 days old, stable (not a pre-release). linux x86_64 only (zbook); other
# platforms are skipped.
#   sabaki   v0.60.0 = 2026-07-03 (v0.60.2 is a pre-release)
#   thorium  v3.5.1  = 2026-09-02
#   katago   v1.18.1 = 2026-08-24, OpenCL backend (v1.18.2 only changes the CUDA backend; its notes point
#            every other backend to v1.18.1).
#   KataGo networks (chz-3z8) in ~/.local/share/katago/models/, read by Sabaki's engine entry and KaTrain's
#   humanlike_model (their modify_ scripts take the paths from here). Neither source publishes a digest
#   (GitHub had none for these): the pins are the sha256 of MH's existing copies (KaTrain's bundled model
#   and the humanv0 KaTrain downloaded), checked equal to fresh downloads on 2026-11-20.
#     katago_model_fast    KaTrain's bundled b10c384 net at its v1.20.0 tag (~72 visits/s on the T1000)
#     katago_model_human   the human-SL net from KataGo v1.15.0's release assets
#
# To bump: tag, asset, sha256 (and dest if it names the version); commit, and the re-install triggers.
# Stale versions in ~/Applications are not removed: delete the old file (appimagelauncherd drops its entry).

applications:
  sabaki:
    repo: SabakiHQ/Sabaki
    tag: "v0.60.0"
    asset: "sabaki-v0.60.0-linux-x64.AppImage"
    sha256: "51105f5308b4f563ffd9284e17508fe2a52a3662457ed8a0c3f23308d4a026ff"
    dest: "Applications/sabaki-v0.60.0-linux-x64.AppImage"
  thorium:
    repo: edrlab/thorium-reader
    tag: "v3.5.1"
    asset: "Thorium-3.5.1-x86_64.AppImage"
    sha256: "906675d518197a4e88eff1d349818db21e49c7979806c325b52e30e31dd22312"
    dest: "Applications/Thorium-3.5.1-x86_64.AppImage"
  katago:
    repo: lightvector/KataGo
    tag: "v1.18.1"
    asset: "katago-v1.18.1-opencl-linux-x64.zip"
    sha256: "81ecea81526adb412a392ec728dbdf9627e754df7cf1a7a3dbb8ef220182184a"
    member: "katago"
    extract: ".local/lib/katago/v1.18.1"  # the AppImage's payload; dest links to its AppRun
    dest: ".local/bin/katago"
  katago_model_fast:
    repo: sanderland/katrain
    tag: "v1.20.0"
    asset: "b10c384h6nbttflrs.bin.gz"
    url: "https://raw.githubusercontent.com/sanderland/katrain/v1.20.0/katrain/models/b10c384h6nbttflrs.bin.gz"
    sha256: "0ba27eced5180b3e3d0b898b280c541112989765e789d1eb6cd0d31b2b2c1229"
    mode: "0644"
    dest: ".local/share/katago/models/b10c384h6nbttflrs.bin.gz"
  katago_model_human:
    repo: lightvector/KataGo
    tag: "v1.15.0"
    asset: "b18c384nbt-humanv0.bin.gz"
    sha256: "637746e44f0efe00ad1245a50aa9bbf0716efe364c43965ead97bd6835d84ab5"
    mode: "0644"
    dest: ".local/share/katago/models/b18c384nbt-humanv0.bin.gz"

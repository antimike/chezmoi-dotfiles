# Pinned kata release (kenn-io/kata, MIT), consumed by run_onchange_install-kata.sh.tmpl.
# The issue tracker D80 recommends; first used in ~/Documents/baduk for the one-week trial (chz-8fp).
#
# Upstream publishes per-OS/arch tarballs; the sha256 digests below are GitHub's asset digests:
#   gh api repos/kenn-io/kata/releases/tags/<tag> --jq '.assets[]|.name+" "+.digest'
#
# Pin rule: exact tag, at least 14 days old. v0.22.0 = 2026-11-05. tools/tracker-trial tested v0.23.0
# (2026-11-09); bump to it once it qualifies (2026-11-23). Only linux_amd64 has been exercised (zbook).
#
# Data lives in ~/.kata (KATA_HOME), outside every repo; the daemon auto-starts on first use.
#
# To bump:
#   1. version: new upstream tag, "v"-prefixed
#   2. checksums: the digests from the gh command above
#   3. commit; the rendered installer hash changes, so the re-install triggers.


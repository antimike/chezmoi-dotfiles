# Pinned wallust release, consumed by run_onchange_install-wallust.sh.tmpl.
#
# wallust (https://codeberg.org/explosion-mental/wallust) generates terminal
# colour schemes from an image; amontillado's theme engine ranks it second,
# after matugen (D73). Not in Fedora and no release binaries, so the installer
# builds it from the crates.io source archive. The pin is that archive's sha256
# (crates.io API, `version.checksum`; the same value cargo's registry index
# records), checked before building. The crate ships its Cargo.lock, and the
# build uses `cargo build --locked`, so dependency versions and checksums come
# from it.
#
# Pin rule: exact version, at least 14 days old. 3.5.1 = 2026-01-16; MIT.
# Builds in about 2.5 minutes with Fedora's Rust 1.98.1; a dependency
# (zune-jpeg) needs rustc 1.75, so the installer prefers /usr/bin/cargo and
# /usr/bin/rustc over a rustup toolchain on PATH. Only installs where the
# `display_server` host key is "wayland".
#
# To bump:
#   1. version: new crates.io version
#   2. sha256:  curl -sL https://crates.io/api/v1/crates/wallust/<version> | jq -r .version.checksum
#   3. check it still builds with --locked, then commit; the rendered script
#      hash changes, so the installer re-runs.
wallust:
  version: "3.5.1"
  sha256:  "45afe16bc8c14dab61ff2acf885034664a6b917ca2ea874ff24eb5107d311ecc"

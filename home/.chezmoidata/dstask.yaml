# Pinned dstask release, consumed by run_onchange_install-dstask.sh.tmpl.
#
# Kept in .chezmoidata rather than fetched at template time so that
# `chezmoi apply`, `chezmoi diff`, and `chezmoi status` stay offline-friendly
# and don't burn the anonymous GitHub API rate limit (60/hr per IP).
#
# The release uploads dash-named binaries (`dstask-<os>-<arch>`). Upstream's
# checksums.sha256 lists different, underscore names (`dstask_<version>_<os>_<arch>`)
# that are NOT uploaded, and its hashes do not match the uploaded files. (BOCO's
# pin used those hashes and an underscore URL, which returns 404.) So the
# checksums below are computed locally from the dash-named assets:
#
#   for p in linux-amd64 darwin-amd64 darwin-arm64; do
#     echo -n "$p: "
#     curl -fsSL "https://github.com/naggie/dstask/releases/download/v<version>/dstask-$p" | sha256sum | cut -d' ' -f1
#   done
#
# Pin rule: exact tag, at least 14 days old. v1.0.1 = 2026-01-10 (upstream's
# latest). Only linux_amd64 has been exercised (zbook); the darwin rows are
# untested on those hosts. There is no linux_arm64 asset (only arm5), so that
# platform skips.
#
# The zsh completion is generated by the installer (`dstask zsh-completion`).
#
# To bump:
#   1. version:   upstream tag stripped of the leading "v"
#   2. checksums: recompute per above
#   3. commit; the script's rendered hash changes, triggering chezmoi to
#      re-run the installer on next `chezmoi apply`.
dstask:
  version: "1.0.1"
  checksums:
    linux_amd64:  "c9db215310657dc1a40cec9ba6588de17350dfe4a1a74823cbb45b00519751ff"
    darwin_amd64: "db24418514df62f51458b9a4db3d8695122670823dd55db2368bcbe0168cc2cc"
    darwin_arm64: "b997783c963ff27e44df7ac7cacd47e5264c90926a44f249384db647366269e0"

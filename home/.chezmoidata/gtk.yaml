gtk:
  theme:
    name: "Adwaita-dark"
  icon_theme:
    # X11 sessions (gtkrc-2.0, xsettingsd); under Wayland gtk3-theme-reload sets gsettings'
    # icon-theme per variant. Papirus: chz-8bg.5 (MH 2026-11-21), review after a week or two.
    name: "Papirus-Dark"
    fallback: "gnome"
  cursor_theme:
    name: "Adwaita"
    size: 0
  font:
    family: "DejaVu"
    face: "Sans"
    size: "10"
  button_images: 1
  menu_images: 1
  toolbar:
    style: GTK_TOOLBAR_BOTH
    icon_size: GTK_ICON_SIZE_LARGE_TOOLBAR
  decoration:
    layout: ":menu"
  enable_event_sounds: 0

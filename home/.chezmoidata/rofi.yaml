rofi:
  modi:
    - window
    - run
    - ssh
    - drun
    - keys
  theme: picker
  # picker: the pickers' family theme in ~/.config/rofi (picker.rasi, colours in colors.rasi;
  # chz-8bg.9). Other values: a theme in /usr/share/rofi/themes (fancy, murz, Arc-Dark, docu, onedark...)
  # can also specify "pywal" for wal-generated colors
  # finally, "i3-mbp" imports the theme from the i3-mbp repo

# Seed wallpapers (chz-8bg.3), consumed by run_after_wallpaper-seeds.sh.tmpl and
# dot_local/share/wallpaper/SOURCE.md.tmpl.
#
# A fresh machine gets a wallpaper before any is fetched: `committed` is the one
# picture in the repo (dot_local/share/wallpaper/seed.jpg, a 16:9 crop at
# 3840x2160 of the first seed, in the X11 timer's library dir `wallpaper.library`
# from .chezmoi.yml), and ~/.local/state/wallpaper/current (hyprpaper's image)
# points at it when the link is missing or dangling. The originals of all
# seeds are downloaded, checked against `sha256` and added to the amontillado
# library (`amo add --name <name>`), so `amo list` and the theme engine see them.
#
# Licence rule (public repo): CC0 or public domain only. MH chose these five on
# 2026-10-30 (the "both" choice of 2026-10-27: a committed seed plus own images).
# The URL is the current original on upload.wikimedia.org. If someone uploads a
# new version of a file, that URL serves other bytes and the checksum fails
# loudly: pin the old revision's archive URL from the file page's history.
#
# To add a seed:
#   1. CC0 or public domain only; check the file page's licence section
#   2. url:    the API's imageinfo url (action=query&prop=imageinfo&iiprop=url|sha1),
#              without the utm_ query
#   3. sha256: download it, compare `sha1sum` with the API's sha1, then sha256sum
#   4. commit; the rendered script changes, and the next apply adds it.
wallpaperSeeds:
  committed:
    file: seed.jpg
    from: commons-good-morning-iss
    crop: "4928x2772+0+420 resized to 3840x2160, JPEG quality 85; the crop drops the ISS solar array"
  seeds:
    - name: commons-good-morning-iss
      title: Good Morning From the International Space Station
      author: Scott Kelly (NASA)
      licence: Public domain (work of the US government, NASA)
      page: https://commons.wikimedia.org/wiki/File:Good_Morning_From_the_International_Space_Station.jpg
      url: https://upload.wikimedia.org/wikipedia/commons/3/3b/Good_Morning_From_the_International_Space_Station.jpg
      sha256: "0681d63b6a38672a3e4c5847601ec671d579189fcc8621e80905587b789b0b6b"
    - name: commons-cloudscape-philippine-sea

      page: https://commons.wikimedia.org/wiki/File:Cloudscape_Over_the_Philippine_Sea.jpg
      url: https://upload.wikimedia.org/wikipedia/commons/3/35/Cloudscape_Over_the_Philippine_Sea.jpg
      sha256: "c26f4446362775f20a19f72d56340ef064e3e5468cd6d2fadc19ce3f09c5df1d"
    - name: commons-jacques-cartier-les-loups

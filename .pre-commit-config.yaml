# Block commits that stage secrets (D35). `system` hook: uses the gitleaks on PATH
# (no clone/build at install time). Install per clone: `mani run install-hooks --all`.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
      # Machine paths with the username (chz-7zz); history in docs/log/ is exempt.
      - id: no-home-paths
        name: no home paths
        entry: tools/no-home-paths/no-home-paths
        language: script
        exclude: ^docs/log/
